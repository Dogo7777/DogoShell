general {
    lock_cmd = pidof hyprlock || hyprlock       # Evita múltiplas instâncias do hyprlock
    before_sleep_cmd = loginctl lock-session    # Bloqueia o ecrã antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # Liga o ecrã ao acordar
}

listener {
    timeout = 300                                 # 5 minutos
    on-timeout = loginctl lock-session            # Aciona o bloqueio (hyprlock)
}

listener {
    timeout = 330                                 # 5.5 minutos
    on-timeout = hyprctl dispatch dpms off        # Desliga o ecrã do monitor
    on-resume = hyprctl dispatch dpms on          # Liga o ecrã ao mover o rato/teclado
}

listener {
    timeout = 900                                 # 15 minutos
    on-timeout = systemctl suspend                # Suspende o sistema
}
