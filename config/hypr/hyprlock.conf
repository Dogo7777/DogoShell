source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = out, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, out
    animation = fadeOut, 1, 4, out
    animation = inputFieldDots, 1, 3, out
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.5
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $accent
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    rounding = 28
    outline_thickness = 2
    outer_color = $accent
    inner_color = rgba(8, 8, 10, 0.65)
    font_color = rgb(240, 240, 240)
    check_color = $accent2
    fail_color = rgba(255, 90, 90, 1)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    placeholder_text = <i>Senha...</i>
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = true
    position = 0, -40
    halign = center
    valign = center
}
